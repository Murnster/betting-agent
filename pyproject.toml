[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "betting-agent"
version = "0.1.0"
description = "Local sports betting ETL pipeline and prediction engine"
requires-python = ">=3.11"
dependencies = [
    "polars>=0.20.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "pydantic-settings>=2.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "nflreadpy>=0.1.0",
    "joblib>=1.3.0",
    "matplotlib>=3.8.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "pyarrow>=23.0.1",
    "nba-api>=1.11.4",
    "nhl-api-py>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/betting_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
